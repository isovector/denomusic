name:                denomusic
version:             0.1.0.0
github:              "isovector/denomusic"
license:             BSD-3-Clause
author:              "Sandy Maguire"
maintainer:          "music@sandymaguire.me"
copyright:           "2025 Sandy Maguire"
language:            GHC2021

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/isovector/denomusic#readme>

dependencies:
- base >= 4.7 && < 5
- Euterpea
- MemoTrie
- QuickCheck
- arrows
- checkers
- containers >= 0.5.9
- deepseq
- distributive
- fingertree
- generic-lens
- groups
- hspec
- lens
- lilypond
- monoid-extras
- monoidal-containers
- mtl
- pretty
- process
- profunctors
- recursion-schemes
- semialign
- step-function
- these
- transformers
- witherable

default-extensions:
- Arrows
- DataKinds
- DerivingStrategies
- DerivingVia
- LambdaCase
- PatternSynonyms
- TypeFamilies
- ViewPatterns
- OverloadedLabels

ghc-options:
- -Wall
- -Wcompat
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wpartial-fields
- -Wredundant-constraints
- -Wno-type-defaults

library:
  source-dirs: src

tests:
  tests:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - denomusic
    - hspec
    - hspec-discover
    - checkers
    - QuickCheck
